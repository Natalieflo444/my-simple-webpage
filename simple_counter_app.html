<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Smooth transitions for pulse and scale */
        .count-pop {
            animation: pop 0.15s ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        /* Glassmorphism details */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
        }
        .dark .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
        }

        /* Hide scrollbars for slick look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300 min-h-full flex flex-col justify-between p-4 sm:p-6 md:p-8">

    <div class="max-w-xl w-full mx-auto flex-1 flex flex-col justify-between gap-6">
        
        <!-- Header Controls -->
        <header class="flex justify-between items-center glass p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-indigo-500/20">
                    #
                </div>
                <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-600 to-violet-500 bg-clip-text text-transparent">
                    Counter
                </h1>
            </div>

            <div class="flex items-center gap-2">
                <!-- Sound Toggle -->
                <button id="soundToggle" title="Toggle Sound" aria-label="Toggle Sound"
                    class="p-2.5 rounded-xl bg-slate-200/60 dark:bg-slate-800/80 hover:bg-slate-300 dark:hover:bg-slate-700 transition active:scale-95 text-slate-600 dark:text-slate-300">
                    <svg id="soundIconOn" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                    <svg id="soundIconOff" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                    </svg>
                </button>

                <!-- Dark Mode Toggle -->
                <button id="themeToggle" title="Toggle Theme" aria-label="Toggle Theme"
                    class="p-2.5 rounded-xl bg-slate-200/60 dark:bg-slate-800/80 hover:bg-slate-300 dark:hover:bg-slate-700 transition active:scale-95 text-slate-600 dark:text-slate-300">
                    <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <svg id="moonIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Counter Display Area -->
        <main class="glass rounded-3xl p-6 sm:p-10 shadow-lg border border-slate-200/80 dark:border-slate-800 flex flex-col items-center justify-center relative overflow-hidden my-auto">
            
            <!-- Target / Limit Banner -->
            <div id="targetBanner" class="w-full mb-4 px-3 py-1.5 rounded-full bg-slate-200/50 dark:bg-slate-800/50 flex items-center justify-between text-xs font-medium text-slate-500 dark:text-slate-400">
                <span>Goal Progress</span>
                <span id="targetProgressText">0%</span>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-2 mb-8 overflow-hidden">
                <div id="progressBar" class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <!-- Main Number Display -->
            <div class="relative py-4 my-2 flex items-center justify-center min-h-[140px]">
                <span id="countDisplay" class="text-7xl sm:text-8xl md:text-9xl font-extrabold tracking-tight text-slate-900 dark:text-white transition-transform transform">
                    0
                </span>
            </div>

            <!-- Status Indicator -->
            <div id="statusMessage" class="h-6 text-sm font-semibold text-indigo-600 dark:text-indigo-400 opacity-0 transition-opacity duration-200 mb-6">
                Goal Reached!
            </div>

            <!-- Control Action Buttons -->
            <div class="flex items-center gap-4 w-full max-w-sm justify-center mb-6">
                <!-- Decrement Button -->
                <button id="decrementBtn" title="Subtract" aria-label="Subtract"
                    class="flex-1 py-5 rounded-2xl bg-rose-500 hover:bg-rose-600 active:bg-rose-700 text-white font-bold text-3xl shadow-lg shadow-rose-500/20 active:scale-95 transition-all flex items-center justify-center">
                    −
                </button>

                <!-- Reset Button -->
                <button id="resetBtn" title="Reset Counter" aria-label="Reset Counter"
                    class="p-5 rounded-2xl bg-slate-200/80 dark:bg-slate-800/80 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-semibold active:scale-95 transition flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>

                <!-- Increment Button -->
                <button id="incrementBtn" title="Add" aria-label="Add"
                    class="flex-1 py-5 rounded-2xl bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-bold text-3xl shadow-lg shadow-emerald-500/20 active:scale-95 transition-all flex items-center justify-center">
                    +
                </button>
            </div>

            <!-- Step Size Selection -->
            <div class="flex items-center gap-2 bg-slate-200/50 dark:bg-slate-800/50 p-1.5 rounded-xl text-xs font-semibold">
                <span class="px-2 text-slate-500 dark:text-slate-400">Step:</span>
                <button class="step-btn px-3 py-1.5 rounded-lg bg-white dark:bg-slate-700 shadow-sm text-indigo-600 dark:text-indigo-300 font-bold" data-step="1">1</button>
                <button class="step-btn px-3 py-1.5 rounded-lg hover:bg-white/50 dark:hover:bg-slate-700/50 transition text-slate-600 dark:text-slate-300" data-step="5">5</button>
                <button class="step-btn px-3 py-1.5 rounded-lg hover:bg-white/50 dark:hover:bg-slate-700/50 transition text-slate-600 dark:text-slate-300" data-step="10">10</button>
                <button class="step-btn px-3 py-1.5 rounded-lg hover:bg-white/50 dark:hover:bg-slate-700/50 transition text-slate-600 dark:text-slate-300" data-step="50">50</button>
            </div>
        </main>

        <!-- Secondary Settings & History Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <!-- Target / Limit Settings Card -->
            <div class="glass p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 flex flex-col gap-3">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Goal & Limits</h2>
                <div class="flex items-center justify-between gap-3 text-sm">
                    <label for="goalInput" class="font-medium text-slate-600 dark:text-slate-300">Target Goal:</label>
                    <input type="number" id="goalInput" value="100" min="1"
                        class="w-24 px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-center font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex items-center justify-between gap-3 text-sm">
                    <label for="minLimitInput" class="font-medium text-slate-600 dark:text-slate-300">Min Limit:</label>
                    <input type="number" id="minLimitInput" value="0"
                        class="w-24 px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-center font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <!-- History Log Card -->
            <div class="glass p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 flex flex-col justify-between gap-2">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">Activity History</h2>
                    <button id="clearHistoryBtn" class="text-xs text-rose-500 hover:text-rose-600 font-medium transition">Clear</button>
                </div>
                
                <div id="historyList" class="flex flex-col gap-1.5 max-h-24 overflow-y-auto no-scrollbar text-xs">
                    <div class="text-slate-400 text-center py-3 italic">No recent activity</div>
                </div>
            </div>
        </div>

        <!-- Keyboard Shortcuts Footer Notice -->
        <footer class="text-center text-xs text-slate-400 dark:text-slate-500">
            Shortcuts: <kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300">Space</kbd> / <kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300">↑</kbd> Add, 
            <kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300">↓</kbd> Subtract, 
            <kbd class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300">R</kbd> Reset
        </footer>
    </div>

    <script>
        // State variables
        let count = 0;
        let step = 1;
        let targetGoal = 100;
        let minLimit = 0;
        let history = [];
        let soundEnabled = true;

        // UI Element Selectors
        const countDisplay = document.getElementById('countDisplay');
        const incrementBtn = document.getElementById('incrementBtn');
        const decrementBtn = document.getElementById('decrementBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressBar = document.getElementById('progressBar');
        const targetProgressText = document.getElementById('targetProgressText');
        const statusMessage = document.getElementById('statusMessage');
        const goalInput = document.getElementById('goalInput');
        const minLimitInput = document.getElementById('minLimitInput');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const stepBtns = document.querySelectorAll('.step-btn');
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        const soundToggle = document.getElementById('soundToggle');
        const soundIconOn = document.getElementById('soundIconOn');
        const soundIconOff = document.getElementById('soundIconOff');

        // Web Audio API Synthesizer for click feedback
        let audioCtx = null;

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'inc') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'dec') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'reset') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.setValueAtTime(150, now + 0.05);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'goal') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            } catch (e) {
                // Ignore audio restriction errors
            }
        }

        // Save and Load from LocalStorage
        function saveState() {
            const data = { count, step, targetGoal, minLimit, history, soundEnabled };
            localStorage.setItem('counter_app_data', JSON.stringify(data));
        }

        function loadState() {
            try {
                const data = JSON.parse(localStorage.getItem('counter_app_data'));
                if (data) {
                    count = typeof data.count === 'number' ? data.count : 0;
                    step = data.step || 1;
                    targetGoal = data.targetGoal || 100;
                    minLimit = typeof data.minLimit === 'number' ? data.minLimit : 0;
                    history = Array.isArray(data.history) ? data.history : [];
                    soundEnabled = data.soundEnabled !== undefined ? data.soundEnabled : true;
                }
            } catch (e) {
                console.warn('Failed to load stored counter state', e);
            }
        }

        // Update UI View
        function updateUI(triggerPop = false) {
            // Update Main Counter
            countDisplay.textContent = count.toLocaleString();

            if (triggerPop) {
                countDisplay.classList.remove('count-pop');
                void countDisplay.offsetWidth; // Trigger reflow for re-animation
                countDisplay.classList.add('count-pop');
            }

            // Update Progress Bar
            const progress = Math.min(Math.max(((count - minLimit) / (targetGoal - minLimit)) * 100, 0), 100);
            progressBar.style.width = `${progress}%`;
            targetProgressText.textContent = `${Math.round(progress)}%`;

            // Check Goal Status
            if (count >= targetGoal) {
                statusMessage.textContent = '🎉 Goal Reached!';
                statusMessage.classList.remove('opacity-0');
            } else {
                statusMessage.classList.add('opacity-0');
            }

            // Sync Inputs
            goalInput.value = targetGoal;
            minLimitInput.value = minLimit;

            // Render History
            renderHistory();

            // Sound UI state
            if (soundEnabled) {
                soundIconOn.classList.remove('hidden');
                soundIconOff.classList.add('hidden');
            } else {
                soundIconOn.classList.add('hidden');
                soundIconOff.classList.remove('hidden');
            }

            // Save State
            saveState();
        }

        // History Management
        function addHistory(action, amount) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            history.unshift({ action, amount, result: count, time });
            if (history.length > 15) history.pop();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = `<div class="text-slate-400 dark:text-slate-500 text-center py-3 italic">No recent activity</div>`;
                return;
            }

            historyList.innerHTML = history.map(item => {
                const colorClass = item.action === 'Added' ? 'text-emerald-500' : item.action === 'Subtracted' ? 'text-rose-500' : 'text-slate-400';
                const prefix = item.action === 'Added' ? '+' : item.action === 'Subtracted' ? '-' : '';
                return `
                    <div class="flex justify-between items-center py-1 border-b border-slate-200/50 dark:border-slate-800/50 last:border-none">
                        <span class="font-medium ${colorClass}">${item.action} (${prefix}${item.amount})</span>
                        <div class="flex items-center gap-2 text-slate-400">
                            <span class="font-semibold text-slate-600 dark:text-slate-300">=${item.result}</span>
                            <span class="text-[10px] opacity-75">${item.time}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Counter Operations
        function handleIncrement() {
            count += step;
            addHistory('Added', step);
            if (count === targetGoal) {
                playSound('goal');
            } else {
                playSound('inc');
            }
            updateUI(true);
        }

        function handleDecrement() {
            if (count - step < minLimit) {
                count = minLimit;
            } else {
                count -= step;
            }
            addHistory('Subtracted', step);
            playSound('dec');
            updateUI(true);
        }

        function handleReset() {
            if (count === 0) return;
            count = 0;
            addHistory('Reset', 0);
            playSound('reset');
            updateUI(true);
        }

        // Event Listeners for Counter Controls
        incrementBtn.addEventListener('click', handleIncrement);
        decrementBtn.addEventListener('click', handleDecrement);
        resetBtn.addEventListener('click', handleReset);

        // Step buttons listener
        stepBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                step = parseInt(btn.dataset.step, 10);
                stepBtns.forEach(b => {
                    b.classList.remove('bg-white', 'dark:bg-slate-700', 'text-indigo-600', 'dark:text-indigo-300', 'shadow-sm', 'font-bold');
                    b.classList.add('text-slate-600', 'dark:text-slate-300');
                });
                btn.classList.add('bg-white', 'dark:bg-slate-700', 'text-indigo-600', 'dark:text-indigo-300', 'shadow-sm', 'font-bold');
                btn.classList.remove('text-slate-600', 'dark:text-slate-300');
                saveState();
            });
        });

        // Limit Inputs Listener
        goalInput.addEventListener('change', (e) => {
            const val = parseInt(e.target.value, 10);
            targetGoal = isNaN(val) ? 100 : val;
            updateUI();
        });

        minLimitInput.addEventListener('change', (e) => {
            const val = parseInt(e.target.value, 10);
            minLimit = isNaN(val) ? 0 : val;
            updateUI();
        });

        // Clear History
        clearHistoryBtn.addEventListener('click', () => {
            history = [];
            renderHistory();
            saveState();
        });

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

            if (e.key === 'ArrowUp' || e.key === '+' || e.key === ' ') {
                e.preventDefault();
                handleIncrement();
            } else if (e.key === 'ArrowDown' || e.key === '-') {
                e.preventDefault();
                handleDecrement();
            } else if (e.key.toLowerCase() === 'r') {
                e.preventDefault();
                handleReset();
            }
        });

        // Theme Toggle
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
                localStorage.setItem('theme', 'dark');
            } else {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
                localStorage.setItem('theme', 'light');
            }
        });

        // Sound Toggle
        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            updateUI();
        });

        // Initialize Theme preference
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            sunIcon.classList.remove('hidden');
            moonIcon.classList.add('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            sunIcon.classList.add('hidden');
            moonIcon.classList.remove('hidden');
        }

        // App Init
        loadState();
        updateUI();
    </script>
</body>
</html>
